name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fetch the live forecast log, if any
        run: |
          mkdir -p data/live
          if git ls-remote --exit-code --heads origin live-data; then
            git fetch --depth 1 origin live-data
            git show origin/live-data:forecast_log.csv > data/live/forecast_log.csv
          fi
      - run: uv run gridcast report
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
