[project]
name = "gridcast"
version = "0.1.0"
description = "Day-ahead probabilistic forecast of French electricity demand with conformal intervals, benchmarked against RTE."
readme = "README.md"
authors = [{ name = "Pierre Chambet", email = "pierrechambet@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.105",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
